name: YouTube Video Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'لینک ویدیو یوتیوب'
        required: true
        type: string
      quality:
        description: 'کیفیت ویدیو'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 1080p
          - 720p
          - 480p

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download video
        run: |
          python download.py "${{ inputs.video_url }}"
      
      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-video-${{ github.run_number }}
          path: downloads/
          retention-days: 7
          compression-level: 0

      - name: Show download info
        run: |
          echo "✅ دانلود کامل شد"
          echo "📦 فایل‌ها در بخش Artifacts این اجرا موجود است"
          ls -lh downloads/
